name: Capability Drift

on:
  workflow_call:
    inputs:
      paths:
        description: Comma-separated source paths to inspect.
        required: false
        default: .
        type: string
      baseline:
        description: Repository-relative baseline path.
        required: false
        default: governance/capability-drift.baseline.json
        type: string
      stack:
        description: Source stack.
        required: true
        type: string
      runs-on:
        description: >-
          Runner label for the job. Default keeps GitHub-hosted (ubuntu-24.04) so existing
          callers are unaffected; callers on the org runner scale set pass hideaki-k3s.
        required: false
        default: ubuntu-24.04
        type: string

jobs:
  capability-drift:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout capability-drift runner
        uses: actions/checkout@v4
        with:
          repository: hideakisolutions/platform-core
          # `github.action_ref` dentro de reusable workflow é clobberado pelo ref da última
          # action composta (vira "v4" do actions/checkout) — runner deve vir de main.
          ref: main
          path: .capability-drift-runner
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare capability-drift baseline
        run: node .capability-drift-runner/tools/capability-drift/analyze.mjs --root "$GITHUB_WORKSPACE" --paths "${{ inputs.paths }}" --baseline "${{ inputs.baseline }}" --stack "${{ inputs.stack }}"
      - name: Publish scorecard
        # O gate é o passo anterior: este só roda se a comparação passou, e o scorecard também vai
        # para o job summary. Falha de publicação (ex.: "Artifact storage quota has been hit" na org
        # que chama) não pode reprovar um ratchet que passou.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: capability-drift
          path: capability-drift.json
          if-no-files-found: error
      - name: Job summary
        if: always()
        run: |
          echo '## Capability drift' >> "$GITHUB_STEP_SUMMARY"
          test -f capability-drift.json && echo '```json' >> "$GITHUB_STEP_SUMMARY" && cat capability-drift.json >> "$GITHUB_STEP_SUMMARY" && echo '```' >> "$GITHUB_STEP_SUMMARY"
